# Render Blueprint: API + Media Worker + PostgreSQL + Key Value(Redis)
# Object storage는 Cloudflare R2(S3 호환)를 쓰고 키는 Render 대시보드에서 입력한다(sync: false).
services:
  - type: web
    name: media-preflight-api
    runtime: docker
    rootDir: apps/api
    plan: free
    healthCheckPath: /api/v1/health
    envVars: &env
      - key: DATABASE_URL
        fromDatabase: { name: media-preflight-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: media-preflight-queue, property: connectionString }
      - { key: OBJECT_STORAGE_ENDPOINT, sync: false }
      - { key: OBJECT_STORAGE_BUCKET, value: media-preflight }
      - { key: OBJECT_STORAGE_ACCESS_KEY, sync: false }
      - { key: OBJECT_STORAGE_SECRET_KEY, sync: false }
      - { key: OBJECT_STORAGE_REGION, value: auto }
      - { key: WEB_ORIGINS, sync: false }
      - { key: MAX_UPLOAD_BYTES, value: "2147483648" }
      - { key: FILE_RETENTION_HOURS, value: "24" }
      - { key: SIGNED_URL_TTL_SECONDS, value: "600" }

  - type: worker
    name: media-preflight-worker
    runtime: docker
    rootDir: apps/api
    plan: starter
    dockerCommand: python -m preflight.worker
    envVars: *env

  - type: keyvalue
    name: media-preflight-queue
    plan: free
    ipAllowList: []

databases:
  - name: media-preflight-db
    plan: free
